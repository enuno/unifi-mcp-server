# Weekly update PRs for the three things this repo pins: Python packages in
# uv.lock, the GitHub Actions in .github/workflows (SHA pins included; the
# version comment is updated with them), and the Dockerfile base image.
# Minor and patch bumps are grouped so a week's updates arrive as one PR per
# ecosystem; major bumps come one at a time.
version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      python-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      actions-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
