name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Least privilege: every job in this workflow only needs to read the repo.
# Explicitly declaring this also makes fork-PR runs safe, since they receive
# a read-only GITHUB_TOKEN by default.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and Format Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      # From uv.lock, so CI tests the versions a release ships with; --locked
      # also fails if pyproject.toml changed without re-running `uv lock`.
      - name: Install dependencies
        run: uv sync --locked --python 3.10 --extra dev --extra fleet

      - name: Check code formatting with Black
        run: |
          source .venv/bin/activate
          black --check src/ tests/

      - name: Check import sorting with isort
        run: |
          source .venv/bin/activate
          isort --check-only src/ tests/

      - name: Lint with Ruff
        run: |
          source .venv/bin/activate
          ruff check src/ tests/

      - name: Type check with MyPy
        run: |
          source .venv/bin/activate
          mypy src/

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      # From uv.lock, so CI tests the versions a release ships with; --locked
      # also fails if pyproject.toml changed without re-running `uv lock`.
      - name: Install dependencies
        run: uv sync --locked --python ${{ matrix.python-version }} --extra dev --extra fleet

      - name: Run unit tests with coverage gate
        run: |
          source .venv/bin/activate
          pytest tests/ -m "not integration" --cov=src --cov-report=xml --cov-report=term-missing --cov-fail-under=80

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        if: matrix.python-version == '3.10'
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

  security:
    name: Security Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      # From uv.lock, so CI tests the versions a release ships with; --locked
      # also fails if pyproject.toml changed without re-running `uv lock`.
      - name: Install dependencies
        run: uv sync --locked --python 3.10 --extra dev --extra fleet

      - name: Run Bandit security linter
        run: |
          source .venv/bin/activate
          bandit -r src/ -f json -o bandit-report.json -ll

      - name: Upload Bandit report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bandit-report
          path: bandit-report.json

  docs:
    name: Documentation Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install interrogate
        run: pip install interrogate

      - name: Check docstring coverage (≥80% of public functions)
        run: interrogate src/tools/ src/api/ --fail-under 80 --verbose

  docker-build:
    name: Docker Build Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: unifi-mcp-server:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
        continue-on-error: true  # Don't fail if Dockerfile doesn't exist yet

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: moderate
        continue-on-error: true  # requires GitHub Dependency Graph feature to be enabled in repo settings

  pre-commit:
    name: Pre-commit Hooks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run pre-commit
        uses: pre-commit/action@v3.0.1
        with:
          extra_args: --all-files
        env:
          SKIP: mypy,end-of-file-fixer,markdownlint  # mypy covered in lint job; cosmetic hooks skipped

  deploy:
    name: Deploy Files Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ansible-core and the playbook's collections
        working-directory: deploy/ansible
        run: |
          pip install "ansible-core==2.17.5" "ansible-lint==24.9.2"
          ansible-galaxy collection install -r requirements.yml -p ./collections

      - name: Syntax-check the playbook
        working-directory: deploy/ansible
        run: |
          for inventory in single cluster; do
            ansible-playbook -i "inventories/$inventory/hosts.yml" site.yml --syntax-check
          done

      - name: Lint the playbook
        working-directory: deploy/ansible
        run: ansible-lint --offline site.yml

  helm:
    name: Helm Chart Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.2

      - name: Lint and render the chart
        run: |
          for values in deploy/helm/unifi-mcp/ci/*.yaml; do
            helm lint deploy/helm/unifi-mcp -f "$values"
            helm template ci deploy/helm/unifi-mcp -f "$values" > "/tmp/$(basename "$values")"
          done

      - name: Validate the manifests
        run: |
          curl -fsSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz \
            | tar xz kubeconform
          ./kubeconform -strict -summary -kubernetes-version 1.30.0 -skip ServiceMonitor /tmp/*-values.yaml

      - name: Build the fleet image
        run: docker build --build-arg EXTRAS=fleet -t unifi-mcp-server:ci .

      - name: Create a kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: ci

      - name: Install the chart with Postgres and smoke-test it
        run: scripts/helm_smoke_test.sh unifi-mcp-server:ci ci

  build-summary:
    name: Build Summary
    runs-on: ubuntu-latest
    needs: [lint, test, security, docs, docker-build, pre-commit]
    if: always()
    steps:
      - name: Check build status
        run: |
          echo "Lint:     ${{ needs.lint.result }}"
          echo "Test:     ${{ needs.test.result }}"
          echo "Security: ${{ needs.security.result }}"
          echo "Docs:     ${{ needs.docs.result }}"
          echo "Docker:   ${{ needs.docker-build.result }}"
          echo "Pre-commit: ${{ needs.pre-commit.result }}"

      - name: Fail if any required job failed
        if: |
          needs.lint.result == 'failure' ||
          needs.test.result == 'failure' ||
          needs.security.result == 'failure' ||
          needs.docs.result == 'failure'
        run: exit 1
