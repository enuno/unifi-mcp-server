name: Plugin Validation

on:
  pull_request:
    branches: [main]
    paths:
      - '.claude-plugin/**'
      - '.mcp.json'
      - 'skills/**'
      - 'scripts/validate_plugins.py'
      - 'scripts/generate_skills_manifest.py'
      - 'scripts/build_plugin_packages.py'
      - 'docs/PLUGINS.md'
      - 'docs/GROK.md'
      - 'docs/CHATGPT_CONNECTOR.md'
      - 'docs/submission/**'
      - 'pyproject.toml'
      - 'server.json'
      - '.github/workflows/plugin-validation.yml'
  push:
    branches: [main]
    paths:
      - '.claude-plugin/**'
      - '.mcp.json'
      - 'skills/**'
      - 'scripts/validate_plugins.py'
      - 'scripts/generate_skills_manifest.py'
      - 'scripts/build_plugin_packages.py'
      - 'pyproject.toml'
      - 'server.json'
      - '.github/workflows/plugin-validation.yml'
  workflow_dispatch:

# Least privilege: this workflow only reads the repository.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate plugin manifests
    runs-on: ubuntu-latest
    env:
      # The SHA256 of https://claude.ai/install.sh as it stood when this
      # workflow was written. Update it when the installer changes.
      CLAUDE_INSTALLER_SHA256: 2c5506d110560bf618bbe88f678f2c2a0047c86a9c6585fc84976120b1de0b44
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      # Pinned to a commit SHA, so the action cannot change under the
      # workflow. The repository's other workflows install uv with
      # curl | sh; a new workflow should not add another one.
      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0

      - name: Install dependencies
        run: uv sync --locked --python 3.12 --extra dev

      # Checks that the manifests are valid JSON, that the version is the
      # same everywhere, that every skill a manifest names exists, and that
      # no manifest carries a secret.
      - name: Validate plugin manifests
        run: |
          source .venv/bin/activate
          python scripts/validate_plugins.py

      # The skills manifest is generated from the skills on disk. Regenerating
      # it must not change it, so a stale manifest fails the build.
      - name: Check the skills manifest is up to date
        run: |
          source .venv/bin/activate
          python scripts/generate_skills_manifest.py
          git diff --exit-code skills/manifest.json

      # Both distributable packages must build from the skills on disk and
      # must carry only the operator skills.
      - name: Build the plugin packages
        run: |
          source .venv/bin/activate
          python scripts/build_plugin_packages.py

      # The GitHub secret-scanning tool runs over the manifests. The regex
      # pass in validate_plugins.py already runs; this adds the scanner.
      # Download the release, verify its checksum, and only then extract
      # it. A checksum that is not pinned would not help.
      - name: Install gitleaks
        run: |
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl -LsSf \
            "https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz" \
            -o "$archive"
          echo "a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb  $archive" | sha256sum --check --strict
          tar -xz -C /usr/local/bin -f "$archive" gitleaks
          gitleaks version

      - name: Scan the manifests for secrets
        run: |
          source .venv/bin/activate
          mkdir -p /tmp/manifests/.claude-plugin /tmp/manifests/skills
          cp .claude-plugin/plugin.json .claude-plugin/marketplace.json /tmp/manifests/.claude-plugin/
          cp .mcp.json skills/manifest.json /tmp/manifests/
          gitleaks detect --no-git --source /tmp/manifests --redact --exit-code 1

      # Claude Code validates the plugin and the marketplace manifests.
      # The validator needs Claude Code v2.1.326 or later.
      # Download the installer, verify its checksum, and only then run it.
      # The installer fetches the latest release, so the checksum is for
      # the bootstrap script, not for the version it installs.
      - name: Install Claude Code
        run: |
          installer="$RUNNER_TEMP/claude-install.sh"
          curl -LsSf https://claude.ai/install.sh -o "$installer"
          echo "$CLAUDE_INSTALLER_SHA256  $installer" | sha256sum --check --strict
          bash "$installer"
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      # The installer fetches the latest release, so check the version the
      # validator needs rather than assuming it.
      - name: Check the Claude Code version
        run: |
          version=$(claude --version | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          echo "Claude Code $version"
          lowest=$(printf '%s\n%s\n' "2.1.326" "$version" | sort -V | head -1)
          test "$lowest" = "2.1.326" || {
            echo "::error::claude plugin validate needs v2.1.326 or later, got $version"
            exit 1
          }

      # The marketplace manifest is the plugin's own file and must be clean.
      - name: Validate the marketplace manifest
        run: |
          claude plugin validate .claude-plugin/marketplace.json --strict

      # The repository root is the plugin root, so it carries the
      # repository's own CLAUDE.md. The docs state that a CLAUDE.md at the
      # plugin root is not loaded as project context, and the validator warns
      # about it, so --strict would fail on a warning about this repository's
      # layout rather than about the plugin. Assert that this is the only
      # warning and that there is no error, so any other finding still fails
      # the build.
      - name: Validate the plugin at the repository root
        run: |
          claude plugin validate . --json > /tmp/plugin-validate.json
          python - <<'PY'
          import json
          import sys

          report = json.load(open("/tmp/plugin-validate.json"))

          KNOWN = "CLAUDE.md at the plugin root is not loaded as project context"

          problems = []

          # The manifest's own errors and warnings, and the same for every
          # content file the validator read.
          for item in [report.get("manifest", {})] + report.get("contents", []):
              for error in item.get("errors", []):
                  problems.append(("error", error.get("message", str(error))))
              for warning in item.get("warnings", []):
                  if KNOWN not in warning.get("message", ""):
                      problems.append(("warning", warning.get("message", str(warning))))

          # The directory checks, which the validator reports separately.
          for finding in report.get("directory", {}).get("findings", []):
              message = finding.get("message", str(finding))
              if finding.get("severity") == "warning" and KNOWN in message:
                  continue
              problems.append((finding.get("severity", "finding"), message))

          for severity, message in problems:
              print(f"::error::{severity}: {message}")

          if problems:
              sys.exit(1)

          print("only the known CLAUDE.md warning was reported")
          PY

      - name: Validate the built Claude plugin package
        run: |
          claude plugin validate dist/claude/unifi-mcp-server --strict

      # The ChatGPT package is a skills-only upload: it must carry a manifest
      # and skills, and it must not carry an MCP server or a marketplace.
      - name: Check the ChatGPT package is skills-only
        run: |
          package=dist/chatgpt/unifi-mcp-server
          test -f "$package/.claude-plugin/plugin.json" || {
            echo "::error::missing .claude-plugin/plugin.json"; exit 1; }
          test -f "$package/plugin.json" || {
            echo "::error::missing plugin.json"; exit 1; }
          test ! -f "$package/.mcp.json" || {
            echo "::error::a skills-only package must not carry .mcp.json"; exit 1; }
          test ! -f "$package/.claude-plugin/marketplace.json" || {
            echo "::error::a skills-only package must not carry marketplace.json"; exit 1; }
          count=$(find "$package/skills" -mindepth 2 -maxdepth 2 -name SKILL.md | wc -l)
          test "$count" -ge 1 || {
            echo "::error::no skills at skills/<name>/SKILL.md"; exit 1; }
          echo "skills-only package holds $count skills"
