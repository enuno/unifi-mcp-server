name: Publish Protect Array Fix Image

on:
  push:
    branches:
      - fix/protect-list-array-responses
    paths:
      - '.github/workflows/publish-protect-fix.yml'
      - 'src/**'
      - 'Dockerfile'
      - 'pyproject.toml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Build and publish patched image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build image for scanning
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: unifi-mcp-protect-scan:local
          platforms: linux/amd64
      - name: Block HIGH and CRITICAL vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: unifi-mcp-protect-scan:local
          severity: HIGH,CRITICAL
          exit-code: '1'
      - name: Publish patched image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/deanpemberton/unifi-mcp-server:protect-array-fix
            ghcr.io/deanpemberton/unifi-mcp-server:protect-array-fix-${{ github.sha }}
