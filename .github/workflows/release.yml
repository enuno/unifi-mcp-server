name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  packages: write
  id-token: write
  discussions: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  validate:
    name: Validate Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Validate version tag
        run: |
          if [[ "${{ github.ref }}" =~ ^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Valid version tag: ${{ github.ref }}"
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "Manual release triggered for version: ${{ github.event.inputs.version }}"
          else
            echo "Invalid version tag format. Expected: v*.*.*"
            exit 1
          fi

      - name: Check if tag exists
        if: github.event_name == 'workflow_dispatch'
        run: |
          if git rev-parse "${{ github.event.inputs.version }}" >/dev/null 2>&1; then
            echo "Tag ${{ github.event.inputs.version }} already exists"
            exit 1
          fi

  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      # The versions in uv.lock, so a release is checked with the same tools
      # (black, ruff, pytest) it was developed with: an unpinned install once
      # pulled a newer black that rejected an already-tagged commit.
      - name: Install dependencies
        run: uv sync --locked --python 3.12 --extra dev --extra fleet

      - name: Run tests
        run: |
          source .venv/bin/activate
          pytest tests/ -m "not integration" --cov=src --cov-report=xml

      - name: Run linting
        run: |
          source .venv/bin/activate
          black --check src/ tests/
          ruff check src/ tests/

      - name: Build Python package
        run: |
          source .venv/bin/activate
          uv pip install build
          python -m build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: python-package
          path: dist/

  publish-pypi:
    name: Publish Python Package to PyPI
    runs-on: ubuntu-latest
    needs: build-and-test
    permissions:
      id-token: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: python-package
          path: dist/

      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          user: __token__
          password: ${{ secrets.PYPI_RELEASE_KEY }}
          packages-dir: dist/

  build-docker:
    name: Build, Scan, and Push Docker Image
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version from tag
        id: meta
        run: |
          if [[ "${{ github.ref }}" =~ ^refs/tags/(.*)$ ]]; then
            VERSION="${BASH_REMATCH[1]}"
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="latest"
          fi
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "image_tag=${VERSION#v}" >> $GITHUB_OUTPUT
          echo "Version: ${VERSION}"

      - name: Extract metadata for Docker
        id: docker-meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build Docker image (local — no push yet)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          load: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:scan-target
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy vulnerability scan — BLOCKS on HIGH/CRITICAL
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:scan-target
          format: table
          exit-code: '1'
          severity: HIGH,CRITICAL

      - name: Push Docker image (only if Trivy passed)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.docker-meta.outputs.tags }}
          labels: ${{ steps.docker-meta.outputs.labels }}
          cache-from: type=gha
          platforms: linux/amd64,linux/arm64

      # The same image with the fleet extras (Redis, Postgres), tagged
      # <version>-fleet; the Helm chart and Ansible playbook use it.
      - name: Extract metadata for the fleet image
        id: docker-meta-fleet
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: |
            suffix=-fleet,onlatest=true
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build the fleet image (local — no push yet)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          load: true
          build-args: |
            EXTRAS=fleet
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:scan-target-fleet
          cache-from: type=gha

      - name: Trivy vulnerability scan of the fleet image — BLOCKS on HIGH/CRITICAL
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:scan-target-fleet
          format: table
          exit-code: '1'
          severity: HIGH,CRITICAL

      - name: Push the fleet image (only if Trivy passed)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          build-args: |
            EXTRAS=fleet
          tags: ${{ steps.docker-meta-fleet.outputs.tags }}
          labels: ${{ steps.docker-meta-fleet.outputs.labels }}
          cache-from: type=gha
          # The fleet extras (greenlet, asyncpg, SQLAlchemy) publish musl
          # wheels for amd64 and arm64 only; 32-bit ARM would compile them.
          platforms: linux/amd64,linux/arm64

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          # The tag the metadata action pushed: semver without the leading "v".
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.docker-meta.outputs.version }}
          format: cyclonedx-json
          output-file: sbom.cyclonedx.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: sbom.cyclonedx.json

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build-and-test, publish-pypi, build-docker]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: python-package
          path: dist/

      - name: Download SBOM
        uses: actions/download-artifact@v8
        with:
          name: sbom
          path: .

      - name: Extract version
        id: version
        run: |
          if [[ "${{ github.ref }}" =~ ^refs/tags/(.*)$ ]]; then
            VERSION="${BASH_REMATCH[1]}"
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="latest"
          fi
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "image_tag=${VERSION#v}" >> $GITHUB_OUTPUT

      - name: Generate changelog
        id: changelog
        run: |
          # Get the previous tag
          PREV_TAG=$(git describe --abbrev=0 --tags $(git rev-list --tags --skip=1 --max-count=1) 2>/dev/null || echo "")

          if [ -z "$PREV_TAG" ]; then
            echo "First release - no previous tag found"
            CHANGELOG="## Initial Release"
          else
            echo "Generating changelog from $PREV_TAG to ${{ steps.version.outputs.version }}"
            CHANGELOG=$(git log $PREV_TAG..HEAD --pretty=format:"- %s (%h)" --no-merges)
          fi

          # Save changelog to file
          cat > CHANGELOG.tmp << EOF
          ## What's Changed

          $CHANGELOG

          **Full Changelog**: https://github.com/${{ github.repository }}/compare/${PREV_TAG}...${{ steps.version.outputs.version }}

          ## Docker Image

          Multi-architecture support: amd64, arm64. The fleet image
          (Postgres and Redis extras) is published for amd64 and arm64.

          \`\`\`bash
          docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.image_tag }}
          docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.image_tag }}-fleet
          \`\`\`

          ## Install from source

          \`\`\`bash
          pip install git+https://github.com/${{ github.repository }}.git@${{ steps.version.outputs.version }}
          \`\`\`
          EOF

      # Immutable releases freeze a release, assets included, the moment it is
      # published, so upload to a draft first and publish once every file is on.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.version }}
        run: |
          state=$(gh release view "$TAG" --json isDraft --jq '.isDraft' 2>/dev/null || echo missing)
          if [ "$state" = "false" ]; then
            echo "::error::Release $TAG is already published; with immutable releases it cannot take assets. Cut a new version."
            exit 1
          fi
          if [ "$state" = "missing" ]; then
            gh release create "$TAG" --draft --target "$GITHUB_SHA" \
              --title "Release $TAG" --notes-file CHANGELOG.tmp
          fi
          gh release upload "$TAG" dist/* sbom.cyclonedx.json --clobber
          gh release edit "$TAG" --draft=false --latest

  announce:
    name: Create Release Announcement
    runs-on: ubuntu-latest
    needs: create-release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      discussions: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Extract version
        id: version
        run: |
          if [[ "${{ github.ref }}" =~ ^refs/tags/(.*)$ ]]; then
            VERSION="${BASH_REMATCH[1]}"
          else
            VERSION="latest"
          fi
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "image_tag=${VERSION#v}" >> $GITHUB_OUTPUT
          echo "version_number=${VERSION#v}" >> $GITHUB_OUTPUT

      - name: Generate announcement content
        id: announcement
        env:
          VERSION: ${{ steps.version.outputs.version }}
          IMAGE_TAG: ${{ steps.version.outputs.image_tag }}
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          REPO: ${{ github.repository }}
        run: |
          PREV_TAG=$(git describe --abbrev=0 --tags "$(git rev-list --tags --skip=1 --max-count=1)" 2>/dev/null || echo "")
          if [ -z "$PREV_TAG" ]; then
            CHANGELOG="- Initial release of UniFi MCP Server"
          else
            CHANGELOG=$(git log "$PREV_TAG..HEAD" --pretty=format:"- %s" --no-merges | head -10)
          fi

          # Markdown with backticks stays in quoted heredocs; only the values
          # below are substituted, so nothing in the text runs as a command.
          {
            echo "# Release ${VERSION}"
            echo
            echo "UniFi MCP Server ${VERSION} is out."
            echo
            echo "## What's changed"
            echo
            echo "${CHANGELOG}"
            echo
            echo "[Full release notes and downloads](https://github.com/${REPO}/releases/tag/${VERSION})"
            echo
            echo "## Container images"
            echo
            echo "amd64 and arm64; the \`-fleet\` image (Postgres and Redis extras) for amd64 and arm64."
            echo
            echo '```bash'
            echo "docker pull ${IMAGE}:${IMAGE_TAG}"
            echo "docker pull ${IMAGE}:${IMAGE_TAG}-fleet"
            echo '```'
            echo
            echo "## Python package"
            echo
            echo "The wheel and sdist are attached to the release. To install from source:"
            echo
            echo '```bash'
            echo "pip install git+https://github.com/${REPO}.git@${VERSION}"
            echo '```'
            echo
            echo "## Documentation"
            echo
            echo "- [Quick start](https://github.com/${REPO}#quick-start)"
            echo "- [Agent skills](https://github.com/${REPO}/blob/main/docs/SKILLS.md)"
            echo "- [Tool reference](https://github.com/${REPO}/blob/main/API.md)"
            echo "- [Changelog](https://github.com/${REPO}/blob/main/CHANGELOG.md)"
          } > announcement.md

      # Discussions can only be created through GraphQL (there is no REST
      # endpoint). A repository without Discussions or without an
      # "Announcements" category is skipped with a warning, and a re-run does
      # not post the same announcement twice.
      - name: Create GitHub Discussion
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
          TITLE: Release ${{ steps.version.outputs.version }}
        run: |
          IFS=$'\t' read -r REPO_ID ENABLED CATEGORY_ID < <(
            gh api graphql -f owner="$OWNER" -f repo="$REPO_NAME" -f query='
              query($owner: String!, $repo: String!) {
                repository(owner: $owner, name: $repo) {
                  id
                  hasDiscussionsEnabled
                  discussionCategories(first: 25) { nodes { id name } }
                }
              }' |
            jq -r '.data.repository as $r | [$r.id, ($r.hasDiscussionsEnabled | tostring),
              (([$r.discussionCategories.nodes[] | select(.name == "Announcements") | .id] | first) // "")] | @tsv'
          )

          if [ "$ENABLED" != "true" ]; then
            echo "::warning::Discussions are not enabled on this repository; skipping the announcement."
            exit 0
          fi
          if [ -z "$CATEGORY_ID" ]; then
            echo "::warning::No \"Announcements\" discussion category; skipping the announcement."
            exit 0
          fi

          EXISTING=$(
            gh api graphql -f owner="$OWNER" -f repo="$REPO_NAME" -f category="$CATEGORY_ID" -f query='
              query($owner: String!, $repo: String!, $category: ID!) {
                repository(owner: $owner, name: $repo) {
                  discussions(first: 50, categoryId: $category, orderBy: {field: CREATED_AT, direction: DESC}) {
                    nodes { title }
                  }
                }
              }' |
            jq -r --arg t "$TITLE" '[.data.repository.discussions.nodes[] | select(.title == $t)] | length'
          )
          if [ "$EXISTING" != "0" ]; then
            echo "An announcement titled \"$TITLE\" already exists; not posting another."
            exit 0
          fi

          gh api graphql -f repositoryId="$REPO_ID" -f categoryId="$CATEGORY_ID" \
            -f title="$TITLE" -F body=@announcement.md -f query='
              mutation($repositoryId: ID!, $categoryId: ID!, $title: String!, $body: String!) {
                createDiscussion(input: {repositoryId: $repositoryId, categoryId: $categoryId, title: $title, body: $body}) {
                  discussion { url }
                }
              }' --jq '.data.createDiscussion.discussion.url'

  notify:
    name: Notification
    runs-on: ubuntu-latest
    needs: [build-and-test, publish-pypi, build-docker, create-release, announce]
    if: always()
    steps:
      - name: Create release summary
        run: |
          echo "## Release Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Step | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Build & Test | ${{ needs.build-and-test.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Docker Build + Trivy Scan | ${{ needs.build-docker.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| GitHub Release (+ SBOM) | ${{ needs.create-release.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Announcement | ${{ needs.announce.result }} |" >> $GITHUB_STEP_SUMMARY
