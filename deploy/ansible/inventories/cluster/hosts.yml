# Several servers: MCP replicas and workers on the mcp hosts, one Redis, one
# Postgres, and nginx in front (sticky per client address and token, as
# MULTI_CONTROLLER.md describes). private_address is what the other hosts
# use to reach each one; keep that network private or encrypted.
#
# Redis and Postgres here are single instances. For high availability use
# managed services (or Sentinel / Patroni) and set unifi_mcp_redis_url and
# unifi_mcp_database_url instead of the redis and postgres groups.
all:
  children:
    lb:
      hosts:
        lb1:
          ansible_host: 192.0.2.20
          private_address: 10.0.0.20
    mcp:
      hosts:
        mcp1:
          ansible_host: 192.0.2.11
          private_address: 10.0.0.11
        mcp2:
          ansible_host: 192.0.2.12
          private_address: 10.0.0.12
    redis:
      hosts:
        data1:
          ansible_host: 192.0.2.30
          private_address: 10.0.0.30
    postgres:
      hosts:
        data1:
