# A single host, deployed from THIS checkout (committed or not) instead of
# a published image or a git ref. See deploy/ansible/overview.md's "Local
# dev deployment" section before using this.
#
# ansible_connection: local because the intended use is deploying this repo
# to the machine you are running Ansible from. Point ansible_host at a
# real reachable address (and switch ansible_connection to ssh) only if
# you really mean "sync my local checkout onto a different box" -- rsync
# over SSH still works, but the box must trust your key.
all:
  children:
    mcp:
      hosts:
        dev:
          ansible_host: 127.0.0.1
          ansible_connection: local
    redis:
      hosts:
        dev:
    postgres:
      hosts:
        dev:
