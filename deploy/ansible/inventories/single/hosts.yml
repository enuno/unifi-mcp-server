# One host runs everything: the MCP server, its worker, Redis and Postgres,
# all as containers on one Docker network (like docker-compose.fleet.yml).
#
# For the MCP server alone (no Redis, no Postgres), delete the redis and
# postgres groups: the server then keeps its audit log as a file and reads
# the controller from UNIFI_* settings.
all:
  children:
    mcp:
      hosts:
        mcp1:
          ansible_host: 192.0.2.10
    redis:
      hosts:
        mcp1:
    postgres:
      hosts:
        mcp1:
