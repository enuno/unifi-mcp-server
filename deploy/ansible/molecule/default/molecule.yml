---
# Converge-and-idempotence test for the Ansible playbook (DEVELOPMENT_PLAN.md
# Phase 7.1). One privileged, systemd-enabled container plays every group in
# the single-host layout (mcp, redis, postgres, lb) so `molecule test` proves
# the playbook that `deploy/ansible/README.md` documents: installs Docker,
# builds the image from this checkout, runs Postgres/Redis/the server/nginx,
# waits for every replica to report healthy, and converges a second time with
# zero changes.
dependency:
  name: galaxy
  options:
    requirements-file: ../../requirements.yml
driver:
  name: docker
platforms:
  - name: mcp1
    image: geerlingguy/docker-ubuntu2204-ansible:latest
    pre_build_image: true
    privileged: true
    cgroupns_mode: host
    command: /sbin/init
    tmpfs:
      - /run
      - /run/lock
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
      # Read-only checkout so the unifi_mcp role builds the image under test
      # from this commit, not from the public GitHub repo's `main`.
      # MOLECULE_PROJECT_DIRECTORY is deploy/ansible (molecule is invoked
      # from there); the repo root is two levels up.
      - ${MOLECULE_PROJECT_DIRECTORY}/../..:/unifi-mcp-src:ro
    groups:
      - mcp
      - redis
      - postgres
      - lb
provisioner:
  name: ansible
  playbooks:
    prepare: prepare.yml
    converge: converge.yml
    verify: verify.yml
  inventory:
    links:
      group_vars: group_vars
    host_vars:
      mcp1:
        ansible_python_interpreter: /usr/bin/python3
verifier:
  name: ansible
scenario:
  test_sequence:
    - dependency
    - cleanup
    - destroy
    - syntax
    - create
    - prepare
    - converge
    - idempotence
    - verify
    - cleanup
    - destroy
