- name: Create the nginx configuration directory
  ansible.builtin.file:
    path: "{{ lb_config_dir }}"
    state: directory
    mode: "0755"

- name: Write the nginx configuration
  ansible.builtin.template:
    src: nginx.conf.j2
    dest: "{{ lb_config_dir }}/nginx.conf"
    mode: "0644"
  register: lb_config

- name: Run nginx
  community.docker.docker_container:
    name: unifi-mcp-lb
    image: "{{ lb_image }}"
    restart_policy: unless-stopped
    published_ports:
      - "{{ lb_listen_port }}:{{ lb_listen_port }}"
    volumes: >-
      {{ [lb_config_dir ~ '/nginx.conf:/etc/nginx/nginx.conf:ro']
         + ([lb_tls_certificate ~ ':/etc/nginx/tls/cert.pem:ro',
             lb_tls_certificate_key ~ ':/etc/nginx/tls/key.pem:ro']
            if lb_tls_certificate and lb_tls_certificate_key else []) }}
    restart: "{{ lb_config.changed }}"
