- name: Check the settings
  ansible.builtin.assert:
    that:
      - vault_postgres_password | default('') | length > 0
    fail_msg: Set vault_postgres_password (vault.yml.example).
    quiet: true

- name: Create the Postgres data directory
  ansible.builtin.file:
    path: "{{ postgres_data_dir }}"
    state: directory
    mode: "0700"

- name: Create the shared Docker network
  community.docker.docker_network:
    name: "{{ unifi_mcp_network }}"

- name: Run Postgres
  community.docker.docker_container:
    name: unifi-mcp-postgres
    image: "{{ postgres_image }}"
    restart_policy: unless-stopped
    networks:
      - name: "{{ unifi_mcp_network }}"
    env:
      POSTGRES_DB: "{{ postgres_db }}"
      POSTGRES_USER: "{{ postgres_owner }}"
      POSTGRES_PASSWORD: "{{ vault_postgres_password }}"
    volumes:
      - "{{ postgres_data_dir }}:/var/lib/postgresql/data"
    # Published only when MCP hosts other than this one need it.
    published_ports: "{{ [postgres_bind_address ~ ':' ~ postgres_port ~ ':5432'] if unifi_mcp_remote_data | bool else [] }}"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U {{ postgres_owner }} -d {{ postgres_db }}"]
      interval: 5s
      timeout: 3s
      retries: 10
  no_log: true

- name: Wait for Postgres to accept connections
  ansible.builtin.command: >-
    docker exec unifi-mcp-postgres pg_isready -U {{ postgres_owner }} -d {{ postgres_db }}
  register: postgres_ready
  until: postgres_ready.rc == 0
  retries: 30
  delay: 2
  changed_when: false

# POSTGRES_PASSWORD only applies when the data directory is first created;
# set it on every run so a changed vault_postgres_password takes effect.
#
# On first initialization the official image starts a temporary server to
# run its init scripts, stops it, then starts the server it actually serves
# from (postgres-entrypoint behaviour). The "Wait for Postgres to accept
# connections" task above can observe a successful pg_isready against that
# temporary server moments before it shuts down, so this call can land in
# the restart gap ("the database system is shutting down"). Retry it too,
# rather than trusting a single race-prone pg_isready.
- name: Apply the owner password
  ansible.builtin.command:
    argv:
      - docker
      - exec
      - -i
      - -e
      - OWNER_PASSWORD
      - unifi-mcp-postgres
      - psql
      - -q
      - -v
      - ON_ERROR_STOP=1
      - -U
      - "{{ postgres_owner }}"
      - -d
      - "{{ postgres_db }}"
    stdin: |
      \getenv owner_password OWNER_PASSWORD
      ALTER ROLE {{ postgres_owner }} PASSWORD :'owner_password';
  environment:
    OWNER_PASSWORD: "{{ vault_postgres_password }}"
  register: unifi_mcp_set_owner_password
  until: unifi_mcp_set_owner_password.rc == 0
  retries: 30
  delay: 2
  changed_when: false
  no_log: true
