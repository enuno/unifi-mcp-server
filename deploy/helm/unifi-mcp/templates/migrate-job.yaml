{{- if and .Values.fleet.enabled .Values.fleet.migrate }}
# Brings the registry schema up to date before the servers start (they
# refuse to run on an old schema). Runs as MIGRATION_DATABASE_URL, the
# schema owner. A hook runs before the chart's ServiceAccount exists, so it
# uses the namespace default one, without a token.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "unifi-mcp.fullname" . }}-migrate
  labels:
    {{- include "unifi-mcp.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrate
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels:
        {{- include "unifi-mcp.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: migrate
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: migrate
          image: {{ include "unifi-mcp.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: [python, -m, src.fleet.cli, migrate]
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          envFrom:
            {{- include "unifi-mcp.envFrom" . | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
{{- end }}
