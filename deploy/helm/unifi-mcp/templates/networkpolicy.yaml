{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "unifi-mcp.fullname" . }}
  labels:
    {{- include "unifi-mcp.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "unifi-mcp.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    {{- if .Values.networkPolicy.from }}
    - from:
        {{- toYaml .Values.networkPolicy.from | nindent 8 }}
      ports:
        - port: http
    {{- end }}
{{- end }}
