{{- if .Values.persistence.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "unifi-mcp.fullname" . }}-logs
  labels:
    {{- include "unifi-mcp.labels" . | nindent 4 }}
  annotations:
    # The audit log outlives an uninstall.
    helm.sh/resource-policy: keep
spec:
  accessModes: [ReadWriteOnce]
  {{- with .Values.persistence.storageClass }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
{{- end }}
{{- if and .Values.fleet.enabled .Values.audit.retentionDays (not .Values.audit.archive.existingClaim) }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "unifi-mcp.fullname" . }}-archive
  labels:
    {{- include "unifi-mcp.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
spec:
  accessModes: [ReadWriteOnce]
  {{- with .Values.audit.archive.storageClass }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.audit.archive.size }}
{{- end }}
