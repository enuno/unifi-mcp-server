# Several replicas and workers on top of docker-compose.fleet.yml
# (docs/FLEET_SCALING_PLAN.md Phase 4). Adds Redis (shared rate limits,
# registry pub/sub, worker leases), three server replicas behind nginx with
# sticky routing on mcp-session-id (MULTI_CONTROLLER.md), and two workers.
#
#   docker compose -f docker-compose.fleet.yml -f docker-compose.fleet-scale.yml up -d
#
# `make verify-fleet-scale` checks the same topology with local processes.

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  unifi-mcp:
    # Replicas are reached through the load balancer, not a host port.
    ports: !reset []
    environment:
      REDIS_URL: redis://redis:6379/0
    deploy:
      replicas: 3
    depends_on:
      redis:
        condition: service_healthy

  worker:
    environment:
      REDIS_URL: redis://redis:6379/0
    deploy:
      replicas: 2
    depends_on:
      redis:
        condition: service_healthy

  lb:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      # Loopback only; put an authenticating TLS proxy in front to expose it.
      - "127.0.0.1:${MCP_SERVER_PORT:-3000}:8080"
    configs:
      - source: nginx
        target: /etc/nginx/conf.d/default.conf
    depends_on:
      unifi-mcp:
        condition: service_started

configs:
  nginx:
    content: |
      # "unifi-mcp" resolves to every replica when nginx starts, one peer per
      # address; after scaling the replicas, restart lb to pick up the change.
      upstream unifi_mcp {
          hash $$http_mcp_session_id consistent;
          server unifi-mcp:${MCP_SERVER_PORT:-3000};
      }
      server {
          listen 8080;
          location / {
              proxy_pass http://unifi_mcp;
              proxy_http_version 1.1;
              proxy_set_header Connection "";
              proxy_buffering off;
              proxy_read_timeout 1h;
          }
      }
